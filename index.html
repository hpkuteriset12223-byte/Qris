<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRIS Base64</title>
    <!-- Digunakan QRCode.toDataURL dari library qrcode.min.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }
        #qris-img {
            width: 90vw;
            height: 90vw;
            max-width: 450px;
            max-height: 450px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- Gambar akan ditampilkan lewat src berupa string Base64 -->
    <img id="qris-img" alt="QRIS Code" />

    <script>
        const DEFAULT_PAYLOAD = "00020101021126570011ID.DANA.WWW011893600915303544414902090354441490303UMI51440014ID.CO.QRIS.WWW0215ID10266027894750303UMI5204549953033605802ID5909TOKO SUKI6015Kota Jakarta Pu610510210630417E0";

        window.onload = function() {
            let amount = getAmountFromURL() || 0;
            generateDynamicQRISBase64(amount);
        };

        function getAmountFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            let amount = urlParams.get('amount') || urlParams.get('nominal') || urlParams.get('rp');
            
            if (!amount) {
                const searchStr = window.location.search.replace('?', '');
                if (!isNaN(searchStr) && searchStr.trim() !== '') {
                    amount = searchStr;
                }
            }
            return amount ? parseInt(amount, 10) : null;
        }

        function parseTLV(qrisString) {
            let tags = {};
            let i = 0;
            let cleanStr = qrisString;
            if (qrisString.includes("6304")) {
                cleanStr = qrisString.substring(0, qrisString.lastIndexOf("6304"));
            }

            while (i < cleanStr.length) {
                let tag = cleanStr.substring(i, i + 2);
                let length = parseInt(cleanStr.substring(i + 2, i + 4), 10);
                
                if (isNaN(length)) break;

                let value = cleanStr.substring(i + 4, i + 4 + length);
                tags[tag] = value;
                i += 4 + length;
            }
            return tags;
        }

        function buildTLV(tags) {
            let result = "";
            let sortedKeys = Object.keys(tags).sort((a, b) => parseInt(a) - parseInt(b));

            for (let key of sortedKeys) {
                let val = tags[key];
                let len = val.length.toString().padStart(2, '0');
                result += key + len + val;
            }
            return result;
        }

        function calculateCRC16(data) {
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
                let x = ((crc >> 8) ^ data.charCodeAt(i)) & 0xFF;
                x ^= x >> 4;
                crc = ((crc << 8) ^ (x << 12) ^ (x << 5) ^ x) & 0xFFFF;
            }
            let hex = crc.toString(16).toUpperCase();
            return hex.padStart(4, '0');
        }

        function generateDynamicQRISBase64(amount) {
            try {
                let tags = parseTLV(DEFAULT_PAYLOAD);

                tags['01'] = '12';
                tags['53'] = '360';

                if (amount > 0) {
                    tags['54'] = amount.toString();
                } else {
                    delete tags['54'];
                }

                let newPayload = buildTLV(tags) + "6304";
                let finalQRIS = newPayload + calculateCRC16(newPayload);

                // Buat temporary container untuk merender QRCode ke Canvas
                let tempDiv = document.createElement('div');
                let qrcode = new QRCode(tempDiv, {
                    text: finalQRIS,
                    width: 500,
                    height: 500,
                    correctLevel: QRCode.CorrectLevel.M
                });

                // Ambil data Base64 dari canvas yang dibuat oleh library
                setTimeout(() => {
                    let canvas = tempDiv.querySelector('canvas');
                    if (canvas) {
                        // Mengubah canvas menjadi URL Base64 (data:image/png;base64,...)
                        let base64Image = canvas.toDataURL("image/png");
                        
                        // Set nilai src dari elemen img
                        document.getElementById('qris-img').src = base64Image;

                        // Jika butuh nilai string Base64-nya saja:
                        console.log("String Base64 QRIS:", base64Image);
                    }
                }, 50);

            } catch (err) {
                console.error("Gagal memproses QRIS", err);
            }
        }
    </script>
</body>
</html>
